<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Principles Lab · AI 原理互动实验</title>
  <style>
    :root{--bg:#f8f5ff;--paper:#fff;--ink:#211d3a;--muted:#625d78;--line:#d8d0ea;--purple:#6d46d9;--purple-soft:#eee8ff;--lime:#ddfc76;--heading:"Avenir Next","PingFang SC",system-ui,sans-serif;--body:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}html{background:var(--bg);color:var(--ink);scroll-behavior:smooth}body{margin:0;min-width:320px;font-family:var(--body);background:radial-gradient(circle at 8% 2%,rgba(221,252,118,.58),transparent 20rem),radial-gradient(circle at 92% 8%,rgba(167,139,250,.23),transparent 25rem),linear-gradient(rgba(109,70,217,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(109,70,217,.035) 1px,transparent 1px),var(--bg);background-size:auto,auto,32px 32px,32px 32px}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}.shell{width:min(1460px,calc(100% - 32px));margin:auto;padding:14px 0 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:58px}.brand{display:flex;align-items:center;gap:11px;font:800 15px var(--heading)}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:12px;background:var(--lime);box-shadow:3px 3px 0 var(--ink)}.brand-mark svg{width:21px;stroke:currentColor}.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.meta i{width:8px;height:8px;border-radius:50%;background:#2db77b}.switcher{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0 14px;padding:7px;border:2px solid var(--ink);border-radius:19px;background:rgba(255,255,255,.88);box-shadow:5px 5px 0 var(--ink)}.principle-tab{position:relative;min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 14px;border:0;border-radius:13px;color:var(--muted);background:transparent;text-align:left;transition:.2s}.principle-tab:hover{color:var(--ink);background:#f8f5ff}.principle-tab[aria-selected="true"]{color:#fff;background:var(--purple);box-shadow:0 4px 0 var(--purple-soft)}.tab-num{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid currentColor;border-radius:10px;font:800 11px ui-monospace,monospace}.tab-copy strong{display:block;font:800 14px var(--heading)}.tab-copy span{display:block;margin-top:3px;font-size:10px;opacity:.85}.summary{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:6px 5px 14px}.summary small{display:block;color:var(--purple);font:800 10px ui-monospace,monospace;letter-spacing:.07em}.summary h1{margin:4px 0 0;font:800 clamp(24px,3vw,38px)/1.06 var(--heading);letter-spacing:-.04em}.summary p{max-width:600px;margin:0;color:var(--muted);font-size:12px;line-height:1.6}.module{width:100%;min-height:720px;display:block;border:0;background:transparent;transition:opacity .18s}.module.loading{opacity:.2}.entry-guide{position:fixed;z-index:1000;width:min(360px,calc(100vw - 28px));padding:20px 54px 19px 20px;border:3px solid var(--ink);border-radius:20px;color:var(--ink);background:linear-gradient(135deg,#fff 0 18%,var(--lime) 100%);box-shadow:8px 8px 0 var(--ink),0 22px 55px rgba(43,30,77,.24);will-change:left,top,transform,opacity}.entry-guide[hidden],.guide-pin[hidden]{display:none}.entry-guide small{display:block;color:var(--purple);font:900 11px ui-monospace,monospace;letter-spacing:.1em}.entry-guide strong{display:block;margin-top:6px;font:900 21px/1.15 var(--heading);letter-spacing:-.035em}.entry-guide p{margin:7px 0 0;color:#49425e;font-size:12px;line-height:1.5}.guide-skip{position:absolute;right:10px;top:10px;width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(33,29,58,.24);border-radius:12px;color:var(--ink);background:rgba(255,255,255,.72)}.guide-skip:hover{border-color:var(--ink);background:#fff}.guide-skip svg{width:16px;stroke:currentColor}.entry-guide::after{content:"";position:absolute;width:20px;height:20px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--lime);transform:rotate(45deg)}.entry-guide[data-side="above"]::after{right:22px;bottom:-12px}.entry-guide[data-side="below"]::after{right:22px;top:-12px;transform:rotate(225deg)}.guide-pin{position:fixed;z-index:999;width:18px;height:18px;border:4px solid #fff;border-radius:50%;background:var(--purple);box-shadow:0 0 0 3px var(--ink);pointer-events:none}.guide-pin::after{content:"";position:absolute;inset:-11px;border:3px solid var(--lime);border-radius:50%;animation:guide-pin 1.25s ease-out infinite}.sr{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    @keyframes guide-pin{to{transform:scale(1.75);opacity:0}}
    .focus-veil{position:fixed;z-index:990;border:3px solid rgba(221,252,118,.96);border-radius:22px;background:transparent;box-shadow:0 0 0 9999px rgba(22,16,42,.58),0 0 0 9px rgba(221,252,118,.2),0 0 42px 12px rgba(221,252,118,.38);pointer-events:none;will-change:left,top,width,height}.focus-veil[hidden]{display:none}.entry-guide{z-index:1002}.guide-pin{z-index:1003;width:58px;height:58px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:18px;color:#fff;background:var(--purple);box-shadow:6px 6px 0 var(--lime),0 12px 30px rgba(31,20,58,.34);will-change:left,top,transform,opacity}.guide-pin svg{width:29px;height:29px;fill:#fff;stroke:var(--ink);filter:drop-shadow(1px 2px 0 rgba(33,29,58,.2))}.guide-pin::after{inset:-13px;border:4px solid var(--lime);animation:none}.guide-pin.arrived::after{animation:guide-pin 1.25s ease-out infinite}.entry-guide small{font-size:12px}.entry-guide strong{font-size:23px}.entry-guide p{font-size:13px}
    @media(min-width:1101px){.shell{zoom:.9}}
    @media(max-width:720px){.shell{width:min(calc(100% - 16px),620px);padding-top:8px}.top{min-height:52px}.meta span{display:none}.switcher{grid-template-columns:1fr;padding:6px}.principle-tab{min-height:58px}.summary{display:block}.summary p{margin-top:8px}.module{min-height:900px}.entry-guide{padding:17px 50px 16px 17px}.entry-guide strong{font-size:18px}}
    @media(max-width:380px){.brand-name{display:none}.tab-copy strong{font-size:12px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <nav class="top" aria-label="网站导航"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="15" r="2.5"/><circle cx="19" cy="15" r="2.5"/><path d="M10.5 7 6.5 13M13.5 7l4 6M7.5 15h9M12 7v14"/></svg></span><span class="brand-name">AI PRINCIPLES LAB</span></div><div class="meta"><i></i><span>三个原理 · 一站式互动学习</span></div></nav>
    <div class="switcher" role="tablist" aria-label="选择要学习的原理">
      <button class="principle-tab" id="tab-loop" type="button" role="tab" aria-selected="true" aria-controls="module"><span class="tab-num">01</span><span class="tab-copy"><strong>Agent Loop · 单体执行循环</strong><span>上下文、规划、工具、回流与记忆</span></span></button>
      <button class="principle-tab" id="tab-collab" type="button" role="tab" aria-selected="false" aria-controls="module"><span class="tab-num">02</span><span class="tab-copy"><strong>Agent 协作 · Subagent / Multi-agent</strong><span>任务委派、共享状态、交叉校验与共识</span></span></button>
      <button class="principle-tab" id="tab-rag" type="button" role="tab" aria-selected="false" aria-controls="module"><span class="tab-num">03</span><span class="tab-copy"><strong>RAG · 知识库全流程</strong><span>离线建库、在线向量检索与引用回答</span></span></button>
    </div>
    <header class="summary"><div><small id="eyebrow">PRINCIPLE · 01</small><h1 id="title">看懂 Agent 如何把一次任务真正做完</h1></div><p id="description">从用户输入进入上下文开始，观察模型如何规划、调用工具，并在证据不足时触发 Agent Loop。</p></header>
    <iframe class="module loading" id="module" name="principle-module" title="Agent Loop 互动实验" src="agent-flow-lab.html?embed=1" scrolling="no"></iframe>
  </main>
  <aside class="entry-guide" id="entryGuide" aria-label="开始体验引导" hidden><button class="guide-skip" id="guideSkip" type="button" aria-label="跳过引导"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button><small>START HERE · 从这里开始</small><strong id="guideTitle">开始一次互动实验</strong><p id="guideText">跟随提示点击高亮位置。</p></aside>
  <span class="focus-veil" id="focusVeil" aria-hidden="true" hidden></span>
  <span class="guide-pin" id="guidePin" aria-hidden="true" hidden><svg viewBox="0 0 32 32"><path d="M5 3.8 25.2 18l-9.1 1.7-4.8 7.9L5 3.8Z" stroke-width="2" stroke-linejoin="round"/></svg></span>
  <div class="sr" id="live" aria-live="polite"></div>
  <script>
    const tabs={loop:{button:document.getElementById('tab-loop'),src:'agent-flow-lab.html?embed=1',title:'看懂 Agent 如何把一次任务真正做完',description:'从用户输入进入上下文开始，观察模型如何规划、调用工具，并在证据不足时触发 Agent Loop。',eyebrow:'PRINCIPLE · 01',frameTitle:'Agent Loop 互动实验'},collab:{button:document.getElementById('tab-collab'),src:'agent-collaboration-lab.html?embed=1',title:'看懂多个 Agent 如何分工并形成可靠结论',description:'对比主 Agent 向 Subagent 委派任务，与多个 Agent 共享状态、交叉校验的两种协作架构。',eyebrow:'PRINCIPLE · 02',frameTitle:'Agent 协作互动实验'},rag:{button:document.getElementById('tab-rag'),src:'_rag-module.html',title:'看懂 RAG 如何先建知识库，再在线找到答案',description:'在同一个 RAG 原理页切换离线建库与在线问答，观察数据加工、向量化、Query 改写、检索、重排与引用生成。',eyebrow:'PRINCIPLE · 03',frameTitle:'RAG 原理互动实验'}};
    const frame=document.getElementById('module'),guide=document.getElementById('entryGuide'),pin=document.getElementById('guidePin'),veil=document.getElementById('focusVeil'),reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let active='loop',guideTimer=null,guideMotion=null,pinMotion=null,veilMotion=null,guideTarget=null,guideEpoch=0;
    const guides={loop:{selector:'#sendBtn',local:'#startCoach',title:'把任务交给 Agent',text:'输入框已放好天气案例，点击发送按钮开始观察 Agent Loop。'},collab:{selector:'#play',title:'播放协作过程',text:'点击自动播放，看主 Agent、Subagent 与 Multi-agent 如何传递任务。'},rag:{selector:'#send',title:'先从在线问答开始',text:'点击发送，观察问题如何先向量化、再改写增强并进入向量检索。'}};
    const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
    function closeGuide(){guideEpoch++;clearTimeout(guideTimer);guideMotion?.cancel();pinMotion?.cancel();veilMotion?.cancel();[guide,pin,veil].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));guideMotion=pinMotion=veilMotion=null;guide.hidden=true;pin.hidden=true;veil.hidden=true;pin.classList.remove('arrived');if(guideTarget){guideTarget.removeEventListener('click',closeGuide);guideTarget=null}}
    function launchGuide(){closeGuide();guideTimer=setTimeout(()=>{const epoch=guideEpoch;let doc,target;try{doc=frame.contentDocument;target=doc?.querySelector(guides[active].selector)}catch(e){return}if(!target)return;const local=guides[active].local&&doc.querySelector(guides[active].local);if(local)local.style.setProperty('display','none','important');const fr=frame.getBoundingClientRect(),tr=target.getBoundingClientRect(),sx=fr.width/(frame.clientWidth||fr.width),sy=fr.height/(frame.clientHeight||fr.height),r={left:fr.left+tr.left*sx,top:fr.top+tr.top*sy,width:tr.width*sx,height:tr.height*sy},maxScroll=Math.max(0,document.documentElement.scrollHeight-innerHeight);if((r.top>innerHeight*.77||r.top+r.height>innerHeight-72)&&scrollY<maxScroll-2){scrollBy({top:r.top-innerHeight*.68,behavior:reduced?'auto':'smooth'});guideTimer=setTimeout(launchGuide,reduced?80:720);return}document.getElementById('guideTitle').textContent=guides[active].title;document.getElementById('guideText').textContent='跟着亮区移动视线。'+guides[active].text;guide.hidden=false;pin.hidden=false;veil.hidden=false;guide.style.left='0px';guide.style.top='0px';const w=guide.offsetWidth,h=guide.offsetHeight,startW=Math.min(330,innerWidth-40),startH=118,startX=clamp(fr.left+(fr.width-startW)/2,20,innerWidth-startW-20),startY=clamp(fr.top+Math.min(190,fr.height*.25),20,innerHeight-startH-20),endX=clamp(r.left-15,8,innerWidth-r.width-38),endY=clamp(r.top-15,8,innerHeight-r.height-38),endW=r.width+30,endH=r.height+30,canSitAbove=endY-h-18>14,side=canSitAbove?'above':'below',endLeft=clamp(r.left+r.width-w+28,14,innerWidth-w-14),endTop=clamp(canSitAbove?endY-h-18:endY+endH+18,14,innerHeight-h-14),cardStartLeft=clamp(startX+(startW-w)/2,14,innerWidth-w-14),cardStartTop=clamp(startY-h-22,14,innerHeight-h-14),pointerStartLeft=startX+startW/2-29,pointerStartTop=startY+startH/2-29,pointerEndLeft=r.left+r.width/2-29,pointerEndTop=r.top+r.height/2-29;guide.dataset.side=side;Object.assign(guide.style,{left:cardStartLeft+'px',top:cardStartTop+'px'});Object.assign(veil.style,{left:startX+'px',top:startY+'px',width:startW+'px',height:startH+'px'});Object.assign(pin.style,{left:pointerStartLeft+'px',top:pointerStartTop+'px'});guideTarget=target;target.addEventListener('click',closeGuide,{once:true});const duration=3900,ease='cubic-bezier(.22,.8,.25,1)';if(reduced){Object.assign(guide.style,{left:endLeft+'px',top:endTop+'px',opacity:1,transform:'none'});Object.assign(veil.style,{left:endX+'px',top:endY+'px',width:endW+'px',height:endH+'px'});Object.assign(pin.style,{left:pointerEndLeft+'px',top:pointerEndTop+'px'});pin.classList.add('arrived');return}guideMotion=guide.animate([{opacity:0,transform:'translateY(14px) scale(.86)'},{offset:.12,opacity:1,transform:'translateY(0) scale(1.04)'},{offset:.3,left:cardStartLeft+'px',top:cardStartTop+'px',opacity:1,transform:'scale(1)'},{offset:.82,left:endLeft+'px',top:endTop+'px',opacity:1,transform:'scale(.94)'},{left:endLeft+'px',top:endTop+'px',opacity:1,transform:'scale(1)'}],{duration,easing:ease,fill:'forwards'});veilMotion=veil.animate([{left:startX+'px',top:startY+'px',width:startW+'px',height:startH+'px'},{offset:.3,left:startX+'px',top:startY+'px',width:startW+'px',height:startH+'px'},{left:endX+'px',top:endY+'px',width:endW+'px',height:endH+'px'}],{duration,easing:ease,fill:'forwards'});pinMotion=pin.animate([{left:pointerStartLeft+'px',top:pointerStartTop+'px',opacity:0,transform:'scale(.55) rotate(-18deg)'},{offset:.12,opacity:1,transform:'scale(1.18) rotate(0)'},{offset:.3,left:pointerStartLeft+'px',top:pointerStartTop+'px',transform:'scale(1)'},{offset:.86,left:pointerEndLeft+'px',top:pointerEndTop+'px',transform:'scale(.9)'},{left:pointerEndLeft+'px',top:pointerEndTop+'px',transform:'scale(1)'}],{duration,easing:ease,fill:'forwards'});Promise.allSettled([guideMotion.finished,pinMotion.finished,veilMotion.finished]).then(()=>{if(epoch!==guideEpoch)return;Object.assign(guide.style,{left:endLeft+'px',top:endTop+'px',opacity:1,transform:'none'});Object.assign(veil.style,{left:endX+'px',top:endY+'px',width:endW+'px',height:endH+'px'});Object.assign(pin.style,{left:pointerEndLeft+'px',top:pointerEndTop+'px',opacity:1,transform:'none'});pin.classList.add('arrived');guideMotion=pinMotion=veilMotion=null})},420)}
    function select(name){if(name===active){frame.contentWindow.postMessage({type:'agent-guide-replay'},'*');return}closeGuide();active=name;const data=tabs[name];Object.entries(tabs).forEach(([key,value])=>value.button.setAttribute('aria-selected',String(key===name)));document.getElementById('title').textContent=data.title;document.getElementById('description').textContent=data.description;document.getElementById('eyebrow').textContent=data.eyebrow;document.getElementById('live').textContent='已切换到'+data.frameTitle;frame.classList.add('loading');frame.title=data.frameTitle;frame.src=data.src;history.replaceState(null,'','#'+name)}
    document.getElementById('guideSkip').addEventListener('click',closeGuide);tabs.loop.button.addEventListener('click',()=>select('loop'));tabs.collab.button.addEventListener('click',()=>select('collab'));tabs.rag.button.addEventListener('click',()=>select('rag'));frame.addEventListener('load',()=>frame.classList.remove('loading'));addEventListener('message',event=>{if(!event.data||event.data.type!=='agent-lab-height')return;const expected=active==='loop'?'loop':active==='collab'?'collaboration':'rag';if(event.data.source!==expected)return;const h=Math.max(640,Math.min(1800,Number(event.data.height)||0));frame.style.height=h+'px';frame.classList.remove('loading')});addEventListener('resize',()=>{if(!guide.hidden)launchGuide()});const requested=location.hash.slice(1);if(tabs[requested]){active=requested==='loop'?'collab':'loop';select(requested)}
  </script>
</body>
</html>
